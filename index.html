<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game-Vault | Instant Digital Key Delivery</title>
    <meta name="description" content="The best prices on Steam, Epic, Xbox, and PlayStation keys. Instant delivery.">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --bg-body: #0f0f13;
            --bg-card: #1a1a24;
            --bg-card-hover: #23232f;
            --primary: #7c4dff;
            --primary-hover: #651fff;
            --text-main: #ffffff;
            --text-muted: #9e9e9e;
            --accent-green: #00e676;
            --border-color: #2a2a35;
            --font-main: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a { text-decoration: none; color: inherit; transition: 0.3s; }
        ul { list-style: none; }

        /* --- LAYOUT UTILITIES --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: rgba(15, 15, 19, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo span { color: var(--primary); }

        nav ul {
            display: flex;
            gap: 30px;
        }

        nav a {
            font-weight: 500;
            color: var(--text-muted);
        }

        nav a:hover { color: var(--text-main); }

        .header-actions button {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-primary-header:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* --- HERO SECTION --- */
        .hero {
            text-align: center;
            padding: 80px 0 60px;
            background: radial-gradient(circle at 50% 0%, #2a2a35 0%, var(--bg-body) 60%);
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 15px;
            background: linear-gradient(to right, #fff, #b388ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(124, 77, 255, 0.2);
        }

        .search-btn {
            position: absolute;
            right: 5px;
            top: 5px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 11px 25px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        .search-btn:hover { background: var(--primary-hover); }

        /* --- GAMES GRID --- */
        .section-title {
            font-size: 1.5rem;
            margin: 60px 0 30px;
            padding-left: 10px;
            border-left: 4px solid var(--primary);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            padding-bottom: 80px;
        }

        .game-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border-color: var(--primary);
        }

        .card-image {
            height: 160px;
            background: #252530;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 0.9rem;
            position: relative;
        }
        
        /* Placeholder styling */
        .card-image::after {
            content: "GAME ART";
            opacity: 0.3;
        }

        .card-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .game-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .price-row {
            margin-top: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .current-price {
            color: var(--accent-green);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .old-price {
            text-decoration: line-through;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .btn-buy {
            width: 100%;
            padding: 12px;
            background: #2a2a35;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .game-card:hover .btn-buy {
            background: var(--primary);
        }

        /* --- FOOTER --- */
        footer {
            background: #0a0a0e;
            padding: 40px 0;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .footer-links {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .footer-links a:hover { color: var(--primary); }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            nav { display: none; } /* Hide nav on mobile for simplicity */
            .header-actions { display: block; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="container">
        <a href="#" class="logo">Game<span>-Vault</span></a>
        <nav>
            <ul>
                <li><a href="#">Games</a></li>
                <li><a href="#">Keys</a></li>
                <li><a href="#">Support</a></li>
            </ul>
        </nav>
        <div class="header-actions">
            <button class="btn-primary-header">Login</button>
        </div>
    </header>

    <!-- Hero -->
    <section class="hero container">
        <h1>Your Vault of Digital Games</h1>
        <p>Instant delivery on Steam, Epic, Origin, and more. Lowest prices guaranteed.</p>
        
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Search for games...">
            <button class="search-btn">Search</button>
        </div>
    </section>

    <!-- Main Content -->
    <main class="container">
        <h2 class="section-title">Trending Now</h2>
        
        <div class="games-grid" id="gamesGrid">
            <!-- Cards will be injected by JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-links">
                <a href="#">Terms</a>
                <a href="#">Privacy</a>
                <a href="#">Contact</a>
            </div>
            <p>&copy; 2026 Game-Vault Inc.</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script>
        // Mock Data for the store
        const games = [
            { title: "Cyber Odyssey 2077", price: "$29.99", oldPrice: "$59.99" },
            { title: "Elden Ring: Shadow", price: "$39.99", oldPrice: "$49.99" },
            { title: "Starfield Premium", price: "$44.99", oldPrice: "$69.99" },
            { title: "Call of Duty: MW3", price: "$34.99", oldPrice: "$69.99" },
            { title: "Baldur's Gate 3", price: "$42.99", oldPrice: "$59.99" },
            { title: "FIFA 24 Ultimate", price: "$24.99", oldPrice: "$69.99" },
            { title: "GTA V: Premium Ed.", price: "$14.99", oldPrice: "$29.99" },
            { title: "Minecraft Java", price: "$26.99", oldPrice: "$29.99" }
        ];

        const grid = document.getElementById('gamesGrid');

        // Generate cards dynamically
        games.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card';
            
            card.innerHTML = `
                <div class="card-image"></div>
                <div class="card-content">
                    <div class="game-title">${game.title}</div>
                    <div class="price-row">
                        <span class="current-price">${game.price}</span>
                        <span class="old-price">${game.oldPrice}</span>
                    </div>
                    <button class="btn-buy">Add to Cart</button>
                </div>
            `;
            grid.appendChild(card);
        });

        // Simple Search Filter
        const searchInput = document.querySelector('.search-input');
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.game-card');
            
            cards.forEach(card => {
                const title = card.querySelector('.game-title').textContent.toLowerCase();
                if(title.includes(term)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    </script>

</body>
</html>
